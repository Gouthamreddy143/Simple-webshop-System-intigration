{% extends "base.html" %}
{% block title %}Customer login{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
<h1 class="h3 mb-3">Customer login</h1>
<form method="post">
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
  <button class="btn btn-primary w-100">Log in</button>
</form>
<p class="mt-3 mb-0 small">New customer? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</div></div>
{% endblock %}
