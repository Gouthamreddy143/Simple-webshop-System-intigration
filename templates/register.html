{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
<h1 class="h3 mb-3">Create customer account</h1>
<form method="post">
  <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Address</label><textarea class="form-control mb-3" name="address" rows="2" required></textarea>
  <label class="form-label">Password (at least 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
  <button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</div></div>
{% endblock %}
